<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit Price Compare</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/purecss@2.0.3/build/pure-min.css"
    integrity="sha384-cg6SkqEOCV1NbJoCu11+bm0NvBRc8IYLRGXkmNrqUBfTjmMYwNKPWBTIKyw9mHNJ" crossorigin="anonymous" />
  <style>
    .compare {
      margin-bottom: 10px;
    }

    .wrap {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: scroll;
    }

    #app {
      margin-left: 10px;
    }

    #app button {
      display: block;
      margin: 0 10px 10px auto;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin: 10px 10px 10px auto;
      justify-content: flex-end;
    }

    .button-group button {
      margin: 0;
    }

    dialog {
      max-width: 90%;
      max-height: 80vh;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    dialog::backdrop {
      background-color: rgba(0, 0, 0, 0.5);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .history-list {
      overflow-y: auto;
      max-height: 60vh;
    }

    .history-entry {
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .history-entry:hover {
      background-color: #f5f5f5;
    }

    .history-date {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .history-data {
      font-size: 0.9em;
    }

    .history-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      padding: 5px 0;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="app" class="pure-form">
      <div class="button-group">
        <button class="pure-button" @click="clearAll">一括クリア</button>
        <button class="pure-button" @click="saveToHistory">履歴に保存</button>
        <button class="pure-button pure-button-primary" @click="showHistory">履歴</button>
      </div>
      <div class="pure-g header">
        <div class="pure-u-1-3">価格</div>
        <div class="pure-u-1-3">量</div>
        <div class="pure-u-1-3">単価</div>
      </div>
      <compare class="compare" v-for="compare,i in compares" :key="i" v-bind.sync="compares[i]"></compare>

      <dialog id="historyModal">
        <div class="history-header">
          <h2>履歴</h2>
          <button class="pure-button" @click="closeHistory">閉じる</button>
        </div>
        <div class="history-list">
          <div v-if="history.length === 0">
            <p>履歴はありません</p>
          </div>
          <div v-for="(entry, index) in history" :key="index" class="history-entry" @click="loadHistoryEntry(entry)">
            <div class="history-date">{{ formatDate(entry.date) }}</div>
            <div class="history-data">
              <div v-for="(item, i) in entry.data" :key="i" class="history-row" v-if="item.price || item.amount">
                <div>価格: {{ item.price || '-' }}</div>
                <div>量: {{ item.amount || '-' }}</div>
                <div>単価: {{ item.price && item.amount ? (item.price / item.amount).toFixed(2) : '-' }}</div>
              </div>
            </div>
          </div>
        </div>
      </dialog>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/http-vue-loader"></script>
  <script src="index.js" type="module"></script>
</body>

</html>
