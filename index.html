<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>単価比較</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="container" x-data="unitPriceApp()">
    <div class="header">
      <h1>単価比較</h1>
    </div>
    
    <div class="button-group">
      <button class="btn-secondary" @click="clearAll">一括クリア</button>
      <button class="btn-secondary" @click="saveToHistory">履歴に保存</button>
      <button class="btn-primary" @click="showHistory">履歴</button>
    </div>
    
    <div class="table-header">
      <div>価格</div>
      <div>量</div>
      <div>単価</div>
    </div>
    
    <template x-for="(compare, i) in compares" :key="i">
      <div class="compare-row">
        <input type="number" x-model.number="compares[i].price" placeholder="0" />
        <input type="number" x-model.number="compares[i].amount" placeholder="0" />
        <input type="number" :value="calcUnitPrice(compare)" readonly />
        <button class="btn-clear" @click="clearRow(i)" title="クリア">×</button>
      </div>
    </template>

    <dialog x-ref="historyModal" @click.self="closeHistory">
      <div class="modal-header" @click.stop>
        <h2>履歴</h2>
        <div style="display:flex;gap:0.5rem">
          <button class="btn-secondary" @click="clearHistory" x-show="history.length>0">全削除</button>
          <button class="btn-secondary" @click="closeHistory">閉じる</button>
        </div>
      </div>
      <div class="modal-body" @click.stop>
        <template x-if="history.length === 0">
          <div class="empty-state">履歴はありません</div>
        </template>
        <template x-for="(entry, index) in history" :key="index">
          <div class="history-entry">
            <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:0.75rem">
              <div class="history-date" x-text="formatDate(entry.date)"></div>
              <button class="btn-secondary" style="padding:0.25rem 0.5rem;font-size:0.75rem" @click.stop="deleteHistoryEntry(index)">削除</button>
            </div>
            <div @click.stop="loadHistoryEntry(entry)" style="cursor:pointer">
              <template x-for="(item, i) in entry.data" :key="i">
                <div x-show="item.price || item.amount" class="history-row">
                  <div x-text="'価格: ' + (item.price || '-')"></div>
                  <div x-text="'量: ' + (item.amount || '-')"></div>
                  <div x-text="'単価: ' + (item.price && item.amount ? (item.price / item.amount).toFixed(2) : '-')"></div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </dialog>
    
    <div x-ref="toast" class="toast" x-text="toastMessage"></div>
  </div>
  <script src="index.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
